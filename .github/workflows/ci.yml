name: Backend CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, run tests and package
        run: mvn -B --no-transfer-progress verify
      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: target/menu-maestro-backend.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to EC2
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, rtr-production]
    timeout-minutes: 20
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download checked application jar
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: build/
      - name: Deploy backend and verify health
        run: bash deployment/deploy.sh "$GITHUB_SHA" "$PWD/build/menu-maestro-backend.jar"
