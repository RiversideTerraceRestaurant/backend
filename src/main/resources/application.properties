spring.application.name=menu-maestro-backend
spring.main.banner-mode=off
spring.threads.virtual.enabled=true
# Routing is fully owned by the API; unknown paths return the JSON 404.
spring.web.resources.add-mappings=false
spring.servlet.multipart.enabled=false
spring.mvc.async.request-timeout=-1
server.error.whitelabel.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
server.tomcat.connection-timeout=15s
server.tomcat.max-swallow-size=16MB
server.forward-headers-strategy=none
server.servlet.encoding.force=false
logging.level.root=INFO
